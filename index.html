<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Trick or Treat Rush</title>
    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --ink: #0d0a14;
        --violet: #2b1838;
        --plum: #45264f;
        --petrol: #14363f;
        --lav: #c3b8dc;
        --rose: #e0a7b4;
        --pumpkin: #ff7a1a;
        --gold: #f0c25e;
        --blood: #8a1626;
        --moss: #6d8f4a;
        --title: "Griffy", "Papyrus", fantasy;
        --ui: "Mystery Quest", "Georgia", serif;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; overflow: hidden; background: #0b0812;
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
        font-family: var(--ui); color: #f3e9d8; letter-spacing: .02em;
      }
      canvas#app { display: block; width: 100%; height: 100%; }
      .layer { position: absolute; inset: 0; pointer-events: none; }
      .hidden { display: none !important; }
      .ink { text-shadow: 0 2px 0 #12081a, 2px 0 0 #12081a, -2px 0 0 #12081a, 0 -2px 0 #12081a, 0 4px 12px rgba(0,0,0,.6); }

      /* --- the storybook title --- */
      .title { font-family: var(--title); text-align: center; line-height: .9; margin: 0; }
      .title .w { display: inline-block; font-size: clamp(40px, 12vw, 64px); background: linear-gradient(180deg, #ffe39a 0%, #ffb347 40%, #ff7a1a 70%, #b8400b 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 3px 0 #2a0f20) drop-shadow(0 0 14px rgba(255,140,40,.45)); }
      .title .w:nth-child(1) { transform: rotate(-5deg) translateY(4px); }
      .title .w:nth-child(2) { transform: rotate(3deg); font-size: clamp(28px, 8vw, 44px); background: linear-gradient(180deg, #efe6ff, #b9a6e0 60%, #7b62a8); -webkit-background-clip: text; background-clip: text; }
      .title .w:nth-child(3) { transform: rotate(-2deg) translateY(-2px); }
      .title .rush { display: block; font-size: clamp(54px, 17vw, 92px); transform: rotate(-3deg); margin-top: -4px; background: linear-gradient(180deg, #fff4c4 0%, #f0c25e 45%, #c47a1c 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 4px 0 #2a0f20) drop-shadow(0 0 22px rgba(240,190,90,.5)); }
      .subtitle { text-align: center; font-size: 15px; color: var(--lav); letter-spacing: .22em; margin-top: 6px; }

      /* --- grimoire panels --- */
      .screen { pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 12px; overflow-y: auto; justify-content: safe center;
        padding: calc(var(--safe-top) + 16px) calc(var(--safe-right) + 16px) calc(var(--safe-bottom) + 20px) calc(var(--safe-left) + 16px);
        background: radial-gradient(ellipse at 50% 30%, rgba(40,20,60,.2) 20%, rgba(8,5,14,.82) 100%); }
      .tome { position: relative; width: 100%; max-width: 380px; padding: 16px 18px; color: #efe5d6;
        background: radial-gradient(ellipse at 50% 0%, rgba(84,52,108,.96), rgba(24,14,36,.97) 75%);
        border: 2px solid #9a86b8; border-radius: 22px 6px 24px 8px / 8px 22px 6px 24px;
        box-shadow: 0 0 0 4px #160d20, 0 0 0 5px #5d4a78, 0 14px 32px rgba(0,0,0,.65), inset 0 0 26px rgba(0,0,0,.55), 0 0 30px rgba(140,90,200,.18); }
      .tome::before, .tome::after { content: ''; position: absolute; width: 26px; height: 26px; border: 2px solid var(--gold); opacity: .75; pointer-events: none; }
      .tome::before { top: 6px; left: 6px; border-right: 0; border-bottom: 0; border-radius: 26px 0 0 0; }
      .tome::after { bottom: 6px; right: 6px; border-left: 0; border-top: 0; border-radius: 0 0 26px 0; }
      .plate { align-self: center; margin: -32px auto 10px; width: max-content; max-width: 100%; padding: 4px 20px 6px; font-family: var(--title); font-size: 24px; color: var(--gold);
        background: linear-gradient(180deg, #3c2350, #1b0f27); border: 2px solid #9a86b8; border-radius: 12px 4px 12px 4px; transform: rotate(-2deg); box-shadow: 0 0 0 3px #12091a, 0 0 16px rgba(240,190,90,.35); }
      .row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 15px; line-height: 1.3; }
      .row + .row { border-top: 1px dashed rgba(195,184,220,.18); }
      .row .ico { width: 28px; text-align: center; font-size: 20px; flex: none; }
      .row b { color: var(--gold); }
      .note { font-size: 13px; color: var(--lav); text-align: center; opacity: .9; max-width: 360px; }

      button { font: inherit; letter-spacing: .06em; border: 0; cursor: pointer; }
      .btn { flex: 1; font-size: 20px; padding: 12px 10px; color: #f6e7c8; border-radius: 16px 5px 16px 5px;
        background: linear-gradient(180deg, #4a2c60, #23142f); border: 2px solid #9a86b8; transform: rotate(-1deg);
        box-shadow: 0 4px 0 #120a18, 0 0 14px rgba(150,110,210,.25), inset 0 1px 0 rgba(255,255,255,.18); text-shadow: 0 2px 0 #12081a; }
      .btn:active { transform: rotate(-1deg) translateY(3px); box-shadow: 0 1px 0 #120a18; }
      .btn.go { position: relative; font-family: var(--title); font-size: 34px; color: #2a0f20; border: 3px solid #3a1208; border-radius: 22px 8px 26px 8px;
        background: radial-gradient(ellipse at 50% 20%, #ffe0a0 0%, #ffb347 30%, #ff7a1a 65%, #c4470c 100%);
        box-shadow: 0 5px 0 #3a1208, 0 0 26px rgba(255,130,30,.55), inset 0 -4px 0 rgba(120,30,0,.35); text-shadow: 0 2px 0 rgba(255,230,180,.6); }
      .btn.go::after { content: ''; position: absolute; left: 18%; right: 18%; bottom: -12px; height: 12px; pointer-events: none;
        background: radial-gradient(circle at 15% 0, #c4470c 5px, transparent 6px), radial-gradient(circle at 48% 0, #c4470c 7px, transparent 8px), radial-gradient(circle at 80% 0, #c4470c 4px, transparent 5px); }
      .btn:disabled { filter: grayscale(.8) brightness(.6); }
      .btns { display: flex; gap: 12px; width: 100%; max-width: 380px; }

      /* --- menu --- */
      .portrait { width: 108px; height: 120px; border-radius: 50%; object-fit: cover; background: radial-gradient(#5e4280, #24152f); border: 4px solid var(--gold); box-shadow: 0 0 0 4px #160d20, 0 0 0 6px #7b62a8, 0 0 30px rgba(240,190,90,.4); }
      .costumes { display: flex; justify-content: center; gap: 8px; margin-top: 4px; }
      .costumes button { width: 52px; height: 52px; border-radius: 50%; font-size: 26px; background: radial-gradient(#3e2652, #1a0f24); border: 2px solid #6d5a87; transition: transform .15s; }
      .costumes button.on { border-color: var(--gold); box-shadow: 0 0 14px rgba(240,190,90,.6); transform: scale(1.12) rotate(-6deg); }
      .costumes button svg.face { width: 44px; height: 44px; display: block; margin: auto; filter: drop-shadow(0 2px 2px rgba(0,0,0,.5)); }
      .ci svg.face { width: 1.35em; height: 1.35em; vertical-align: middle; }
      .costumeName { text-align: center; color: var(--gold); font-size: 15px; min-height: 20px; }
      .field { display: flex; align-items: center; gap: 8px; justify-content: center; font-size: 14px; color: var(--lav); margin-top: 6px; }
      .field input { font: inherit; font-size: 18px; width: 150px; padding: 6px 10px; color: #fff; background: rgba(0,0,0,.35); border: 2px solid #6d5a87; border-radius: 10px 3px 10px 3px; text-align: center; letter-spacing: .08em; user-select: text; -webkit-user-select: text; }
      .bestLine { font-size: 15px; color: var(--lav); }
      .bestLine b { color: var(--gold); font-size: 18px; }

      /* --- lobby --- */
      .slots { display: flex; flex-direction: column; gap: 8px; }
      .slot { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px 4px 12px 4px; background: rgba(0,0,0,.3); border: 1px solid rgba(195,184,220,.25); font-size: 18px; }
      .slot.empty { opacity: .4; font-style: italic; font-size: 15px; }
      .slot .tag { margin-left: auto; font-size: 12px; color: var(--gold); letter-spacing: .12em; }
      .slot.me { border-color: var(--gold); }

      /* --- HUD --- */
      #hud { padding: calc(var(--safe-top) + 10px) calc(var(--safe-right) + 10px) calc(var(--safe-bottom) + 12px) calc(var(--safe-left) + 10px); }
      .hudTop { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 6px; }
      .hudTop > :first-child { justify-self: start; }
      .hudTop > :last-child { justify-self: end; }
      .chip { display: flex; align-items: center; gap: 6px; padding: 4px 10px 5px; font-size: 13px; white-space: nowrap; color: #f3e9d8; min-width: 0;
        background: linear-gradient(180deg, rgba(60,36,80,.88), rgba(20,12,30,.88)); border: 2px solid rgba(154,134,184,.8); border-radius: 14px 4px 14px 4px; box-shadow: 0 3px 10px rgba(0,0,0,.45); }
      .chip b { color: var(--gold); font-size: 20px; font-variant-numeric: tabular-nums; }
      .chip .two { display: flex; flex-direction: column; line-height: 1.05; min-width: 0; }
      .chip .two small { font-size: 10px; letter-spacing: .12em; color: var(--lav); }
      .chip.leader { max-width: 34vw; }
      .chip.leader b { overflow: hidden; text-overflow: ellipsis; color: var(--rose); font-size: 17px; }
      .lolly { width: 18px; height: 18px; border-radius: 50%; flex: none; background: conic-gradient(#ff5a8a 0 25%, #fff 0 50%, #ff5a8a 0 75%, #fff 0); box-shadow: 0 0 0 2px #2a0f20; }
      #timer { transform: rotate(-1.5deg); font-family: var(--title); font-size: 30px; color: var(--gold); line-height: 1.1;
        padding: 2px 18px 6px; border-radius: 50% 50% 14px 14px / 70% 70% 14px 14px; background: radial-gradient(ellipse at 50% 30%, #4a2c60, #160d20); border: 2px solid var(--gold); box-shadow: 0 0 0 3px #12091a, 0 0 18px rgba(240,190,90,.35); font-variant-numeric: tabular-nums; }
      #timer.mad { color: #ff5a4a; border-color: #ff5a4a; animation: throb 1s infinite; box-shadow: 0 0 0 3px #12091a, 0 0 26px rgba(255,60,40,.7); }
      #timer.low { color: #ffd0c0; }
      @keyframes throb { 50% { transform: rotate(1.5deg) scale(1.08); } }
      #effects { position: absolute; top: calc(var(--safe-top) + 58px); left: calc(var(--safe-left) + 10px); display: flex; flex-direction: column; gap: 5px; }
      .fx { font-size: 14px; padding: 3px 10px; border-radius: 10px 3px 10px 3px; background: rgba(20,12,30,.8); border: 1px solid; }
      .fx.rain { border-color: #ffb0e0; color: #ffd6ef; } .fx.shield { border-color: #6fd8ff; color: #b5ecff; }
      .fx.magnet { border-color: #ff5a5a; color: #ffb0a8; } .fx.double { border-color: #c27bff; color: #e3c2ff; } .fx.slow { border-color: #8aff60; color: #c8ffb0; }
      .fx.giant { border-color: #ff6a4a; color: #ffc0b0; } .fx.thief { border-color: #5affd8; color: #bfffef; } .fx.ghost { border-color: #e6e0ff; color: #f4f0ff; }
      #madTag { position: absolute; top: calc(var(--safe-top) + 62px); left: 50%; transform: translateX(-50%); font-size: 13px; color: #ff8a7a; letter-spacing: .2em; animation: blink 1.2s infinite; }
      @keyframes blink { 50% { opacity: .35; } }

      /* joystick and buttons */
      #joy { position: absolute; left: calc(var(--safe-left) + 86px); bottom: calc(var(--safe-bottom) + 96px); width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; pointer-events: none;
        background: radial-gradient(circle, rgba(60,36,80,.35) 40%, rgba(20,12,30,.55) 70%); border: 2px dashed rgba(195,184,220,.55); opacity: .7; transition: opacity .2s; }
      #joy.active { bottom: auto; margin: -56px 0 0 -56px; opacity: 1; }
      #knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; border-radius: 50%; transform: translate(-50%, -50%);
        background: radial-gradient(circle at 40% 35%, #ffd38a, #ff7a1a 55%, #8a2c08); box-shadow: 0 0 0 3px #2a0f20, 0 0 14px rgba(255,130,30,.5); }
      .pad { position: absolute; right: calc(var(--safe-right) + 14px); bottom: calc(var(--safe-bottom) + 18px); display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto; gap: 10px; align-items: end; justify-items: center; pointer-events: none; }
      .pad button { pointer-events: auto; }
      .round { width: 70px; height: 70px; border-radius: 50%; color: #f3e9d8; font-size: 11px; line-height: 1.05; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
        background: radial-gradient(circle at 50% 35%, #5a3878, #1f122c); border: 2px solid #9a86b8; box-shadow: 0 4px 0 #120a18, 0 0 12px rgba(150,110,210,.3); }
      .round .i { font-size: 26px; line-height: 1; }
      .round:active { transform: translateY(3px); box-shadow: 0 1px 0 #120a18; }
      #btnCam { width: 58px; height: 58px; grid-column: 2; grid-row: 1; }
      #btnPower { grid-column: 1; grid-row: 2; width: 80px; height: 80px; position: relative; }
      .levels { display: flex; justify-content: center; gap: 6px; }
      .levels button { font: inherit; font-size: 15px; letter-spacing: .08em; padding: 7px 12px; color: var(--lav); background: rgba(0,0,0,.35); border: 2px solid #6d5a87; border-radius: 12px 4px 12px 4px; }
      .levels button.on { color: #2a0f20; background: linear-gradient(180deg, #ffe0a0, #ff9a3c); border-color: #3a1208; }
      #btnPower.empty { opacity: .45; }
      #btnPower.ready { border-color: var(--gold); animation: glowpulse 1s infinite; }
      @keyframes glowpulse { 50% { box-shadow: 0 4px 0 #120a18, 0 0 26px rgba(240,190,90,.9); } }
      #btnKnock { grid-column: 2; grid-row: 2; width: 112px; height: 112px; border-radius: 48% 52% 46% 54% / 56% 50% 50% 44%; font-family: var(--title); font-size: 19px; line-height: 1; color: #2a0f20; padding: 18px 10px 10px;
        background: radial-gradient(ellipse at 50% 30%, #ffe0a0 0%, #ffb347 30%, #ff7a1a 62%, #b23e0a 100%); border: 3px solid #3a1208; box-shadow: 0 5px 0 #3a1208, 0 0 28px rgba(255,130,30,.7); text-shadow: 0 1px 0 rgba(255,230,180,.6); position: relative; }
      #btnKnock::before { content: ''; position: absolute; top: -14px; left: 50%; width: 10px; height: 18px; margin-left: -5px; background: #4d6a2c; border-radius: 4px 6px 2px 2px; transform: rotate(12deg); }
      #btnKnock.cool { filter: grayscale(.7) brightness(.65); }
      #btnKnock.pop { animation: knockIn .35s; }
      @keyframes knockIn { from { transform: scale(.3) rotate(-20deg); } 70% { transform: scale(1.12) rotate(4deg); } }
      #doorHint { position: absolute; right: calc(var(--safe-right) + 14px); bottom: calc(var(--safe-bottom) + 220px); font-size: 14px; color: var(--gold); text-align: right; }

      /* messages */
      #banner { position: absolute; top: 28%; left: 0; right: 0; text-align: center; font-family: var(--title); font-size: 50px; line-height: 1; color: var(--gold); opacity: 0; transform: scale(.6) rotate(-3deg); transition: opacity .18s, transform .25s cubic-bezier(.2, 1.6, .4, 1); padding: 0 12px; }
      #banner.show { opacity: 1; transform: scale(1) rotate(-3deg); }
      #banner.bad { color: #ff6a5a; } #banner.good { color: #ffd34a; } #banner.mad { color: #ff4a3a; font-size: 56px; } #banner.big { font-size: 110px; }
      #banner small { display: block; font-family: var(--ui); font-size: 18px; color: #f3e9d8; margin-top: 8px; letter-spacing: .04em; }
      #popups { overflow: hidden; }
      .popup { position: absolute; left: 50%; top: 50%; font-family: var(--title); font-size: 30px; color: #ffd34a; transform: translate(-50%, 0) rotate(-4deg); animation: rise 1.1s forwards; white-space: nowrap; }
      .popup.bad { color: #ff6a5a; } .popup.power { color: #c9a0ff; }
      @keyframes rise { 0% { opacity: 0; transform: translate(-50%, 12px) scale(.7) rotate(-4deg); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.1) rotate(-4deg); } 100% { opacity: 0; transform: translate(-50%, -80px) scale(1) rotate(-4deg); } }
      #flash { background: radial-gradient(ellipse at center, rgba(120,20,60,0) 35%, rgba(140,20,40,.6) 100%); opacity: 0; transition: opacity .5s; }
      #flash.on { opacity: 1; transition: none; }
      #bolt { background: radial-gradient(ellipse at 50% 20%, rgba(235,242,255,.5), rgba(185,200,255,.22)); opacity: 0; transition: opacity .3s; }
      #madVeil { background: radial-gradient(ellipse at center, rgba(80,0,40,0) 55%, rgba(90,10,50,.26) 100%); opacity: 0; transition: opacity 2s; }
      #madVeil.on { opacity: 1; }
      #tags { overflow: hidden; }
      .tag3d { position: absolute; transform: translate(-50%, -100%); font-size: 13px; white-space: nowrap; padding: 2px 8px; border-radius: 9px 3px 9px 3px; background: rgba(20,12,30,.72); border: 1px solid rgba(195,184,220,.5); }
      .tag3d.house { color: #cbb7ff; } .tag3d.house.ready { color: var(--gold); border-color: var(--gold); }
      .tag3d.lead::before { content: '👑 '; }

      /* results */
      .rank { display: flex; align-items: center; gap: 10px; padding: 8px 10px; font-size: 19px; border-radius: 12px 4px 12px 4px; }
      .rank + .rank { margin-top: 6px; }
      .rank .pos { width: 28px; font-family: var(--title); font-size: 24px; color: var(--lav); text-align: center; }
      .rank .sc { margin-left: auto; color: var(--gold); font-size: 22px; font-variant-numeric: tabular-nums; }
      .rank.win { background: linear-gradient(90deg, rgba(240,190,90,.28), rgba(240,190,90,.05)); border: 1px solid var(--gold); }
      .rank.win .pos::before { content: '👑'; }
      .rank.win .pos span { display: none; }
      .rank.me .nm { text-decoration: underline; text-decoration-color: var(--rose); }
      .hero { font-family: var(--title); font-size: 44px; line-height: 1; color: var(--gold); text-align: center; transform: rotate(-3deg); }
      .king { font-family: var(--title); font-size: 26px; color: #ffd34a; text-align: center; transform: rotate(2deg); text-shadow: 0 0 16px rgba(255,200,60,.6); }
      #paused { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; background: rgba(8,5,14,.65); font-family: var(--title); font-size: 56px; color: var(--gold); }
      #paused small { font-family: var(--ui); font-size: 18px; color: #f3e9d8; }
      #loading { pointer-events: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: radial-gradient(ellipse at 50% 40%, #2b1838, #0b0812 70%); }
      .bar { width: min(70vw, 300px); height: 16px; border-radius: 10px; background: #1a1024; border: 2px solid #6d5a87; overflow: hidden; }
      .bar div { height: 100%; width: 0; background: linear-gradient(90deg, #c4470c, #ff7a1a, #ffd38a); transition: width .3s; }
      #loadTip { color: var(--lav); font-size: 14px; text-align: center; max-width: 300px; }
      #diag { position: absolute; inset: 10px; pointer-events: auto; overflow: auto; background: rgba(0,0,0,.88); color: #cfc; font: 12px/1.4 monospace; padding: 12px; white-space: pre-wrap; z-index: 9; }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>

    <div id="madVeil" class="layer"></div>
    <div id="flash" class="layer"></div>
    <div id="bolt" class="layer"></div>
    <div id="tags" class="layer"></div>
    <div id="popups" class="layer"></div>

    <div id="hud" class="layer hidden">
      <div class="hudTop">
        <div class="chip ink"><span class="lolly"></span><span class="two"><small id="lblCandy">MY CANDY</small><b id="myCandy">000</b></span></div>
        <div id="timer" class="ink">03:00</div>
        <div class="chip leader ink"><span>👑</span><span class="two"><small id="lblLeader">LEADER</small><b id="leaderName">—</b></span></div>
      </div>
      <div id="madTag" class="hidden">🌕 MIDNIGHT</div>
      <div id="effects"></div>
      <div id="joy"><div id="knob"></div></div>
      <div id="doorHint" class="ink"></div>
      <div class="pad">
        <button id="btnCam" class="round ui-block" aria-label="camera"><span class="i">👁</span><span id="camLbl">3RD</span></button>
        <button id="btnPower" class="round ui-block empty" aria-label="power-up"><span class="i" id="powerIcon">✦</span><span id="powerLbl">POWER-UP</span></button>
        <button id="btnKnock" class="ui-block hidden">TRICK OR TREAT!</button>
      </div>
      <div id="banner" class="ink"></div>
    </div>

    <div id="menu" class="layer screen hidden">
      <h1 class="title" id="titleText"><span class="w">TRICK</span> <span class="w">OR</span> <span class="w">TREAT</span><span class="rush">RUSH</span></h1>
      <div class="subtitle" id="subtitle">MULTIPLAYER HALLOWEEN ADVENTURE</div>
      <img id="portrait" class="portrait" alt="" />
      <div class="costumes" id="costumes"></div>
      <div class="costumeName" id="costumeName"></div>
      <div class="levels" id="levels"></div>
      <div class="field" id="nameField"><span id="lblName">NAME</span><input id="nameInput" maxlength="12" autocomplete="off" spellcheck="false" /></div>
      <div class="bestLine" id="bestLine"></div>
      <div class="btns"><button class="btn go" id="btnPlay">PLAY</button></div>
      <div class="btns"><button class="btn" id="btnHow">HOW TO PLAY</button></div>
      <div class="note" id="modeNote"></div>
    </div>

    <div id="how" class="layer screen hidden">
      <div class="tome"><div class="plate" id="howTitle">HOW TO PLAY</div><div id="howRows"></div></div>
      <div class="btns"><button class="btn" id="btnHowClose">GOT IT</button></div>
    </div>

    <div id="lobby" class="layer screen hidden">
      <div class="tome"><div class="plate" id="lobbyTitle">LOBBY</div>
        <div class="note" id="roomName" style="margin-bottom:10px"></div>
        <div class="slots" id="slots"></div>
        <div class="note" id="lobbyStatus" style="margin-top:12px"></div>
      </div>
      <div class="btns"><button class="btn go" id="btnStart">START</button></div>
      <div class="btns"><button class="btn" id="btnLobbyBack">BACK</button></div>
    </div>

    <div id="results" class="layer screen hidden">
      <div class="hero" id="resHero">TIME'S UP!</div>
      <div class="king" id="resKing"></div>
      <div class="tome"><div class="plate">🎃</div><div id="ranking"></div><div class="note" id="resNote" style="margin-top:10px"></div></div>
      <div class="btns"><button class="btn go" id="btnAgain">PLAY AGAIN</button></div>
      <div class="btns"><button class="btn" id="btnFriends">FRIENDS</button><button class="btn" id="btnMenu">MENU</button></div>
    </div>

    <div id="paused" class="hidden"><span id="pausedTitle">PAUSED</span><small id="pausedSub">tap to carry on</small></div>

    <div id="loading" class="layer">
      <h1 class="title"><span class="w">TRICK</span> <span class="w">OR</span> <span class="w">TREAT</span><span class="rush">RUSH</span></h1>
      <div class="bar"><div id="loadFill"></div></div>
      <div id="loadTip"></div>
    </div>
    <div id="diag" class="hidden"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
